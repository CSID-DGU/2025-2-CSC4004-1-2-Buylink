name: Deploy (Backend + AI)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (for push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push backend image (latest, sha)
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/buylink-backend:latest
            ghcr.io/${{ secrets.GHCR_USER }}/buylink-backend:${{ github.sha }}

      - name: Build & Push ai image (latest, sha)
        uses: docker/build-push-action@v6
        with:
          context: ./AI
          file: ./AI/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/buylink-ai:latest
            ghcr.io/${{ secrets.GHCR_USER }}/buylink-ai:${{ github.sha }}

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          test -s ~/.ssh/id_rsa

      - name: Remote deploy via SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "GHCR_USER='${{ secrets.GHCR_USER }}' GHCR_PAT='${{ secrets.GHCR_PAT }}' ENV_PROD='${{ secrets.ENV_PROD }}' bash -se" << 'EOF'
              set -euo pipefail

              cd /new_data/bm/buylink

              printf "%s" "$ENV_PROD" > .env.prod
              chmod 600 .env.prod

              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

              export GHCR_USER

              docker compose -f docker-compose.prod.yml --env-file .env.prod pull
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
              docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          EOF
