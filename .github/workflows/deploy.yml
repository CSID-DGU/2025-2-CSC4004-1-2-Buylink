name: Deploy (Backend + AI)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          test -s ~/.ssh/id_rsa

      - name: Remote deploy via SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "GHCR_USER='${{ secrets.GHCR_USER }}' GHCR_PAT='${{ secrets.GHCR_PAT }}' bash -se" << 'EOF'
              set -euo pipefail

              cd /new_data/bm/buylink

              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
              export GHCR_USER

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              docker compose -f docker-compose.prod.yml ps
          EOF
