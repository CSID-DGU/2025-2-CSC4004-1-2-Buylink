name: Deploy (Backend + AI)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # 1) secret -> key file (줄바꿈 유지)
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2) known_hosts
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          # 3) (디버그) 키가 비어있으면 바로 실패시키기
          test -s ~/.ssh/id_rsa

      - name: Remote deploy via SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.EC2_PORT }}" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "GHCR_USER='${{ secrets.GHCR_USER }}' GHCR_PAT='${{ secrets.GHCR_PAT }}' bash -se" << 'EOF'
              set -euo pipefail

              cd /opt/buylink

              # GHCR 로그인 (EC2에서 pull 하니까 EC2에서 로그인해야 함)
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

              # compose에서 ${GHCR_USER} 쓰고 있으니(현재 파일 구조상) 환경변수로 확실히 주입
              export GHCR_USER

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              docker compose -f docker-compose.prod.yml ps
          EOF
